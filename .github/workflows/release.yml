name: Release AppImage

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
      VIRTUAL_JOYSTICK_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl desktop-file-utils file pkg-config libssl-dev libudev-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install AppImage tools
        run: |
          cargo install cargo-appimage --version 2.4.0 --locked
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimage-tools/appimagetool"
          chmod +x "$RUNNER_TEMP/appimage-tools/appimagetool"
          echo "$RUNNER_TEMP/appimage-tools" >> "$GITHUB_PATH"

      - name: Build AppImage
        run: |
          cargo build --release --locked
          cargo appimage --locked
          test -s target/appimage/linux_virtual_joystick.AppImage
          chmod +x target/appimage/linux_virtual_joystick.AppImage

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              target/appimage/linux_virtual_joystick.AppImage --clobber
          else
            gh release create "$RELEASE_TAG" \
              target/appimage/linux_virtual_joystick.AppImage \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
